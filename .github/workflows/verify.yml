name: Verify project
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned 3D runtime locally (not from CDN)
        run: npm install --no-audit --no-fund
      - name: Validate Curiosity JavaScript
        run: |
          node --check curiosity_explorer.js
          node --check curiosity_360_renderer.js
          node --check open_world.mjs
          node --check open_world_core.js
          node --test tests/open-world-core.test.cjs
          node --test tests/curiosity.test.cjs tests/curiosity-mission-control.test.cjs
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Check Python compilation
        run: python -m compileall -q mars_dem_server.py catalog_store.py scripts tests
