name: Unified NASA science + 206-bone anatomical Z2 astronaut

on:
  push:
    branches: [feature/mars-eva-unified-motion-science, feature/astronaut-anatomical-206, feature/astronaut-motion-genesis-v5, feature/astronaut-human-mocap-v6]
  pull_request:
    branches: [feature/jezero-60km-named-region, feature/mars-eva-unified-motion-science]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eva-unified-motion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 33
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install scientific and WebGL dependencies
        run: |
          python -m pip install -r requirements.txt
          npm install --no-audit --no-fund
      - name: Verify merged Astra DEM and animation source syntax
        run: |
          python -m compileall -q mars_dem_server.py scripts/
          node --check astronaut_motion.mjs
          node --check open_world.mjs
          node --check open_world_visuals.mjs
          node --check scripts/decode_nasa_z2.cjs
          node --check tests/unified-browser.test.cjs
          python scripts/verify_static_dem.py jezero_dem_precomputed.json
      - name: Check Motion Genesis modules and deterministic grounded IK tests
        run: |
          node --check astronaut_motion/motor.mjs
          node --check astronaut_motion/math.mjs
          node --check astronaut_motion/metrics.mjs
          node --check astronaut_motion/terrain_adapter.mjs
          node --test tests/motion-genesis.test.mjs
      - name: Run combined scientific planner, Curiosity and terrain regression
        run: |
          python -m unittest discover -s tests -v
          node --test tests/curiosity*.test.cjs tests/dem-routing.test.cjs tests/open-world-core.test.cjs
      - name: Download original NASA Z-2 visual suit with attribution
        run: python scripts/prepare_astronaut.py
      - name: Require original reviewed NASA Z2 source and decode Draco mesh
        run: |
          node scripts/decode_nasa_z2.cjs \
            assets/astronaut_z2.glb \
            node_modules/three/examples/jsm/libs/draco/draco_decoder.js \
            _motion_raw
      - name: Produce 206-bone anatomically named NASA educational suit
        run: |
          python scripts/build_motion_asset.py \
            assets/astronaut_z2.glb \
            _motion_raw \
            assets/astronaut_z2_anatomical_206.glb
      - name: Validate file integrity, glTF skin and animation clips
        run: |
          python - <<'PY'
          import json,struct
          from pathlib import Path
          p=Path('assets/astronaut_z2_anatomical_206.glb')
          b=p.read_bytes()
          assert b[:4]==b'glTF' and struct.unpack_from('<I',b,8)[0]==len(b)
          n=struct.unpack_from('<I',b,12)[0]
          data=json.loads(b[20:20+n])
          assert len(data['skins'])==1 and len(data['skins'][0]['joints'])==206
          assert set(a['name'] for a in data['animations'])=={'idle','walk','fast_walk'}
          attrs=data['meshes'][0]['primitives'][0]['attributes']
          assert 'WEIGHTS_0' in attrs and 'JOINTS_0' in attrs
          assert len(b)<30_000_000
          print('Verified NASA Z-2 visual geometry; 206 anatomical joints, 80 axial and 126 appendicular, three clips')
          PY
      - name: Independently verify 206 adult bones and GPU skinning
        run: python scripts/verify_anatomy206.py assets/astronaut_z2_anatomical_206.glb
      - name: Retarget actual CMU human-walking recording for Z2
        run: |
          python -m pip install --no-deps 'scipy==1.16.3'
          python scripts/retarget_cmu_walk.py mocap/cmu/02_01_walk_original.zip mocap/cmu_walk_human_v6.json
          python - <<'PY'
          import json,math
          from pathlib import Path
          p=Path('mocap/cmu_walk_human_v6.json')
          obj=json.loads(p.read_text())
          assert obj['format']=='MarsEVA-CMU-HumanWalk-v1'
          assert len(obj['tracks'])==20
          assert len(obj['times'])==66
          assert all(len(t['quats'])==66*4 for t in obj['tracks'])
          for track in obj['tracks']:
           for a in range(0,len(track['quats']),4):
            q=track['quats'][a:a+4]
            assert abs(sum(x*x for x in q)-1)<.00008
          assert p.stat().st_size<250000
          print('20 genuine recorded-human joint rotation tracks verified, original BVH hash pinned')
          PY
      - name: Build standalone offline web app with Astra validated CTX
        run: |
          python scripts/build_static_site.py \
            --dem jezero_dem_precomputed.json \
            --output _unified/Mars_EVA_Navigator_Unified
      - name: Verify actual WebGL suit and gait in Chrome
        id: browser
        timeout-minutes: 5
        run: node tests/unified-browser.test.cjs
      - name: Publish completed runnable Windows-compatible website
        uses: actions/upload-artifact@v4
        with:
          name: Mars_EVA_Unified_Astra_Science_NASA_Animated_Astronaut
          path: _unified/Mars_EVA_Navigator_Unified/
          if-no-files-found: error
          retention-days: 7
      - name: Publish auditable scientific and skeletal source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Mars_EVA_Unified_Science_Animation_Source
          path: |
            mars_dem_server.py
            scripts/prepare_dem.py
            scripts/verify_dem.py
            scripts/prepare_astronaut.py
            scripts/decode_nasa_z2.cjs
            scripts/build_motion_asset.py
            scripts/anatomy206.py
            scripts/verify_anatomy206.py
            scripts/retarget_cmu_walk.py
            mocap/cmu/02_01_walk_original.zip
            docs/HUMAN_WALK_V6.md
            scripts/build_static_site.py
            tests/test_dem.py
            tests/test_prepare_dem.py
            tests/dem-routing.test.cjs
            tests/unified-browser.test.cjs
            tests/motion-genesis.test.mjs
            astronaut_motion/motor.mjs
            astronaut_motion/math.mjs
            astronaut_motion/quality.mjs
            astronaut_motion/metrics.mjs
            astronaut_motion/terrain_adapter.mjs
            docs/MOTION_GENESIS_V5.md
            docs/ANATOMY_206.md
            docs/jezero-dem.md
            docs/jezero-dem-verification.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish Chrome motion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mars_EVA_Unified_Motion_Browser_Evidence
          path: motion_evidence/
          if-no-files-found: warn
          retention-days: 7
